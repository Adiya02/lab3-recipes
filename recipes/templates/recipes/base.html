<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Рецепты{% endblock %}</title>
    <style>
    * { box-sizing: border-box; }
    body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
        background: #f4faff;              /* нежно-голубой фон страницы */
        color: #2c3e50;
        line-height: 1.5;
    }

    nav {
        background: #eaf4ff;              /* светло-голубая плашка меню */
        border: 1px solid #cfe4f7;
        border-radius: 10px;
        padding: 1rem 1.5rem;
        margin-bottom: 1.5rem;
    }
    nav a {
        margin-right: 1.5rem;
        color: #3b82f6;
        text-decoration: none;
        font-weight: 500;
    }
    nav a:hover { color: #1d4ed8; text-decoration: underline; }

    h1 {
        color: #1e3a5f;
        border-bottom: 3px solid #a9d1f5;  /* мягкая голубая линия */
        padding-bottom: .4rem;
    }
    h2 { color: #334155; margin-top: 2rem; }

    .msg { padding: .8rem 1.2rem; margin: .8rem 0; border-radius: 8px; }
    .msg.success { background: #d1fae5; border-left: 4px solid #10b981; color: #065f46; }
    .msg.error   { background: #fee2e2; border-left: 4px solid #ef4444; color: #991b1b; }

    form {
        background: #ffffff;
        padding: 1.5rem;
        border-radius: 10px;
        border: 1px solid #dbeafe;         /* нежно-голубая рамка */
        margin-bottom: 1rem;
    }
    form p { margin: .8rem 0; }
    label { display: inline-block; min-width: 170px; font-weight: 500; }

    input[type=text], input[type=number], textarea, select {
        padding: .5rem .7rem;
        border: 1px solid #cfe4f7;
        border-radius: 6px;
        font-size: 1rem;
        font-family: inherit;
        background: #fbfdff;               /* еле заметный голубой оттенок полей */
    }
    input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: #93c5fd;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(147,197,253,.35);
    }

    button {
        background: #bcdcf7;               /* нежно-голубая кнопка */
        color: #1e3a5f;
        border: 1px solid #a9d1f5;
        padding: .6rem 1.2rem;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
        font-weight: 500;
    }
    button:hover { background: #a9d1f5; }
    button:active { transform: translateY(1px); }

    .card {
        background: #ffffff;
        border: 1px solid #dbeafe;
        border-radius: 10px;
        padding: 1.2rem 1.5rem;
        margin: 1rem 0;
    }

    table {
        border-collapse: collapse;
        width: 100%;
        background: #fff;
        border: 1px solid #dbeafe;
        border-radius: 8px;
        overflow: hidden;
    }
    th {
        background: #eaf4ff;                /* голубая шапка таблицы */
        color: #1e3a5f;
        text-align: left;
    }
    th, td { padding: .6rem .9rem; border-bottom: 1px solid #e6f0fb; }
    tr:nth-child(even) td { background: #f8fbff; }   /* лёгкое чередование */
    tr:hover td { background: #eaf4ff; }

    pre {
        background: #f4faff;
        color: #1e3a5f;
        border: 1px solid #dbeafe;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
        font-size: .9rem;
    }

    details summary {
        cursor: pointer;
        color: #3b82f6;
        font-weight: 500;
        padding: .5rem 0;
    }
    details summary:hover { text-decoration: underline; }

    a { color: #3b82f6; }
    a:hover { color: #1d4ed8; }
</style>
</head>
<body>
<nav>
    <a href="{% url 'index' %}">Главная</a>
    <a href="{% url 'files' %}">Файлы</a>
</nav>
<hr>

{% if messages %}
    {% for m in messages %}
        <div class="msg {{ m.tags }}">{{ m }}</div>
    {% endfor %}
{% endif %}

{% block content %}{% endblock %}
</body>
</html>
